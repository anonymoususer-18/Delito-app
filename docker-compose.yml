services:
  catalogue-service:
    build: ./catalogue-service
    environment:
      DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - catalogue-data:/data

  cart-service:
    build: ./cart-service
    environment:
      DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - cart-data:/data

  order-service:
    build: ./order-service
    environment:
      DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - order-data:/data

  payment-service:
    build: ./payment-service
    environment:
      DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - payment-data:/data

  notification-service:
    build: ./notification-service
    environment:
      DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - notification-data:/data

  ai-assistant-service:
    build: ./ai-assistant-service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      CATALOGUE_SERVICE_URL: http://catalogue-service:8001
      PYTHONUNBUFFERED: "1"
    volumes:
      - generated-images:/app/app/generated-images
    depends_on:
      - catalogue-service

  api-gateway:
    build: ./api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CATALOGUE_SERVICE_URL: http://catalogue-service:8001
      CART_SERVICE_URL: http://cart-service:8002
      ORDER_SERVICE_URL: http://order-service:8003
      PAYMENT_SERVICE_URL: http://payment-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      AI_SERVICE_URL: http://ai-assistant-service:8006
      PYTHONUNBUFFERED: "1"
    depends_on:
      - catalogue-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
      - ai-assistant-service

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  catalogue-data:
  cart-data:
  order-data:
  payment-data:
  notification-data:
  generated-images:
